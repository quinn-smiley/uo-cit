<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CS 111 - Project 8">
  <meta name="author" content="Quinn Smiley">
  <title>Project 8</title>
  <style>
        canvas {
            border: 1px solid black;
            background-color: white;
        }
  </style>
</head>
<body>
  <div><canvas id="canvas" width="800" height="600"></canvas></div>
    <div>
      <button id="clearButton">Clear Canvas</button>
      <select id="colorSelect">
          <option id="black">Black</option>
          <option id="pink">Pink</option>
          <option id="red">Red</option>
          <option id="orange">Orange</option>
          <option id="yellow">Yellow</option>
          <option id="green">Green</option>
          <option id="blue">Blue</option>
          <option id="purple">Purple</option>
      </select>
      <select id="widthSelect"></select>
    </div>
    <div>
      <label for="opacitySlider">Opacity:</label>
      <input
        type="range"
        id="opacitySlider"
        min="0"
        max="1"
        step="0.1"
        value="1"
      />
    </div>
    <div>
      <h3>Instructions</h3>
      Click and drag to draw on the canvas.
      <br/>
      Use the color selector to change the color of the line.
      <br/>
      Use the width selector to change the width of the line.
      <br/>
      Use the opacity slider to change the opacity of the line.
      <br/>
      Use the clear button to clear the canvas.
      <br/>
      Hold down the shift key to erase.
    </div>
    
    <script src="p8.js"></script>
</body>
</html>
